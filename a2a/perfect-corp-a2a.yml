grade: conformant
grade_basis: >-
  Graded against A2A 1.0.0. Hard checks all pass — `capabilities` is an object, `protocolVersion` is
  present (0.3.0), and `skills` is an array. The optional fields that usually decide near-conformant
  are all present too: preferredTransport, defaultInputModes and defaultOutputModes.
deviations:
  - field: skills
    observed: '[]'
    impact: >-
      The array is present and therefore conformant, but it is EMPTY, so the card advertises no
      callable skill. An A2A client reading this card learns the agent exists and where its
      documentation and MCP endpoint are, and nothing it can invoke over A2A.
  - field: protocolVersion
    observed: 0.3.0
    impact: >-
      Declares the 0.3.x protocol line rather than 1.0.0. Not a conformance failure — the card is
      served at the canonical 0.3+ path — but it dates the implementation.
  - field: capabilities.extensions[0]
    observed: 'https://modelcontextprotocol.io -> params.url https://docs.perfectcorp.com/mcp'
    impact: >-
      The real capability behind this card is MCP, not A2A. The card functions as a pointer to the
      documentation MCP server; the three PRODUCT MCP servers on mcp-api-01.makeupar.com are not
      referenced from it.

