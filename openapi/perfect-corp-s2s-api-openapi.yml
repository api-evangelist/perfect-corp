    BlushEffect:
      type: object
      description: 'Applies blush to the cheeks using predefined patterns and customizable color palettes. Pattern names must correspond to labels from the official blush.json pattern catalog.

        '
      required:
      - category
      - pattern
      - palettes
      properties:
        category:
          type: string
          enum:
          - blush
          description: 'Identifies this effect as a blush effect. Must always be "blush".

            '
        pattern:
          type: object
          description: 'Defines how the blush is placed on the face. Each pattern corresponds to a face shape and layout from blush.json.

            '
          required:
          - name
          properties:
            name:
              type: string
              description: 'Name of the blush pattern. Must be equal to a `label` from the blush.json pattern catalog.

                '
              example: 1color1
        palettes:
          type: array
          minItems: 1
          description: 'List of color palette entries. The number of palettes required depends on the `colorNum` field defined in the selected blush pattern.

            '
          items:
            type: object
            required:
            - color
            - texture
            - colorIntensity
            properties:
              color:
                type: string
                description: 'Primary blush color in hex format (#RRGGBB). Used as the dominant pigment for the blush application.

                  '
                pattern: ^#?[0-9A-Fa-f]{6}$
              texture:
                type: string
                enum:
                - matte
                - satin
                - shimmer
                description: "Texture of the blush:\n  - matte: pure pigment, no shine\n  - satin: soft glow, requires glowStrength\n  - shimmer: sparkly or luminous, requires shimmer parameters\n"
              glowStrength:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Glow intensity for satin blush textures. Required when texture = "satin" or "shimmer".

                  '
              shimmerColor:
                type: string
                description: 'Color of shimmer particles. Required when texture = "shimmer".

                  '
              shimmerDensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Density of shimmer particles in the blush application. Required when texture = "shimmer".

                  '
              colorIntensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Strength of the blush color relative to the base pigment.

                  '
      example:
        category: blush
        pattern:
          name: 1color1
        palettes:
        - color: '#ff7777'
          texture: matte
          colorIntensity: 60
    ContourEffect:
      type: object
      description: 'Defines contouring for facial sculpting using patterns tailored to specific face shapes. Contour patterns determine highlight/shadow placement, while palettes control the contour shade.

        '
      required:
      - category
      - pattern
      - palettes
      properties:
        category:
          type: string
          enum:
          - contour
          description: 'Identifies this effect as a contour effect. Must always be "contour".

            '
        pattern:
          type: object
          required:
          - name
          description: 'Defines where contour shadowing is applied on the face. Must use a pattern name defined in contour.json (e.g., HeartFace2, OvalFace6).

            '
          properties:
            name:
              type: string
              description: 'Name of the contour pattern. Must be equal to a `label` from contour.json.

                '
              example: OvalFace6
        palettes:
          type: array
          minItems: 1
          description: 'Defines the pigment used for contouring. Usually a cool-tone or neutral shade darker than foundation.

            '
          items:
            type: object
            required:
            - color
            - colorIntensity
            properties:
              color:
                type: string
                description: 'Contour pigment color in #RRGGBB hex format.

                  '
              colorIntensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Strength of contour pigmentation. Higher values result in deeper shadows.

                  '
      example:
        category: contour
        pattern:
          name: OvalFace6
        palettes:
        - color: '#8a5b3e'
          colorIntensity: 55
    EyelashesEffect:
      type: object
      description: 'Enhances eyelashes by applying pigment to detected lash strands. Lash extensions or density enhancements depend on the selected pattern, while the palette controls lash color and intensity.

        '
      required:
      - category
      - pattern
      - palettes
      properties:
        category:
          type: string
          enum:
          - eyelashes
          description: 'Identifies this effect as an eyelashes effect. Must always be "eyelashes".

            '
        pattern:
          type: object
          required:
          - name
          description: 'Defines which eyelash style is applied (natural, artistic, winged, upper/lower, etc.). Must match a `label` from eyelashes.json.

            '
          properties:
            name:
              type: string
              description: 'Name of the eyelash pattern from eyelashes.json.

                '
              example: Upper1
        palettes:
          type: array
          minItems: 1
          description: 'Eyelash color palettes. Eyelashes do not support shimmer/metallic effects — only color and intensity.

            '
          items:
            type: object
            required:
            - color
            - colorIntensity
            properties:
              color:
                type: string
                description: 'Eyelash color in HEX format (#RRGGBB).

                  '
              colorIntensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Darkness/pigment strength applied to the lashes.

                  '
      example:
        category: eyelashes
        pattern:
          name: Upper1
        palettes:
        - color: '#000000'
          colorIntensity: 80
    EyelinerEffect:
      type: object
      description: 'Applies eyeliner using customizable patterns and pigment settings. Patterns define the eyeliner layout (e.g., Arabic shapes, winged styles), while palettes specify color, texture, shimmer/metallic effects, and intensity.

        '
      required:
      - category
      - pattern
      - palettes
      properties:
        category:
          type: string
          enum:
          - eye_liner
          description: 'Identifies this effect as an eyeliner effect. Must always be "eye_liner".

            '
        pattern:
          type: object
          required:
          - name
          description: 'Defines the eyeliner shape and placement. Pattern names must match labels from eyeliner.json.

            '
          properties:
            name:
              type: string
              description: 'Name of the eyeliner pattern. Must be equal to a label from eyeliner.json.

                '
              example: Arabic3
        palettes:
          type: array
          minItems: 1
          description: 'Eyeliner color palette entries. Each palette controls pigment color, shimmer/metallic effects, and overall intensity. More palettes are used when the selected eyeliner pattern requires multiple colors.

            '
          items:
            type: object
            required:
            - color
            - texture
            - colorIntensity
            properties:
              color:
                type: string
                description: 'Eyeliner pigment color in #RRGGBB format.

                  '
              texture:
                type: string
                enum:
                - matte
                - shimmer
                - metallic
                description: 'Eyeliner texture finish specifies the look of the liner, whether it''s matte for a flat opaque effect, shimmer for a sparkling reflective finish (with shimmer fields), or metallic for a glossy metallic sheen (requiring shimmer fields and metallic intensity).

                  '
              shimmerColor:
                type: string
                description: 'Color used for shimmer or metallic reflective particles. Required if texture is shimmer or metallic.

                  '
              shimmerIntensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Strength of reflective sparkle. Required when texture is shimmer or metallic.

                  '
              metallicIntensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Metallic reflectivity level. Required when texture = metallic.

                  '
              colorIntensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Pigmentation strength for the eyeliner color.

                  '
      example:
        category: eye_liner
        pattern:
          name: Arabic3
        palettes:
        - color: '#000000'
          texture: matte
          colorIntensity: 80
    BasicRunTaskV2SrcFileId_17:
