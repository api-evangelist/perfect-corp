    EyebrowsEffect:
      type: object
      description: 'Shapes and colors the eyebrows using customizable geometry and color palettes. When `pattern.type = shape`, the pattern defines the brow geometry (arch, curvature, thickness). When `pattern.type = color`, only pigment changes are applied.

        '
      required:
      - category
      - pattern
      - palettes
      properties:
        category:
          type: string
          enum:
          - eyebrows
          description: 'Identifies this effect as an eyebrow styling effect. Must always be "eyebrows".

            '
        pattern:
          type: object
          description: 'This setting defines the eyebrow pattern mode, which can either adjust the shape or apply color only. Pattern names must match the labels in eyebrows.json when required.

            '
          required:
          - type
          oneOf:
          - title: ShapePattern
            description: Shape-based eyebrow styling (geometry + optional color).
            required:
            - name
            properties:
              type:
                type: string
                enum:
                - shape
                description: Use customized eyebrow pattern shape
              name:
                type: string
                description: 'Name of the eyebrow shape pattern. Must match a `label` from eyebrows.json.

                  '
                example: SoftArch1
              curvature:
                type: integer
                minimum: -100
                maximum: 100
                description: 'Adjusts how curved the brow is. Negative = flatter / straighter, positive = more curved.

                  '
              thickness:
                type: integer
                minimum: -100
                maximum: 100
                description: 'Controls eyebrow thickness adjustment relative to the detected brow. Positive = thicker, negative = thinner.

                  '
              definition:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Sharpness and clarity of the brows. Higher values increase brow edge definition for a cleaner look.

                  '
          - title: ColorPattern
            description: Color-only eyebrow styling (no geometry change).
            properties:
              type:
                type: string
                enum:
                - color
                description: Use user's original eyebrow shape
        palettes:
          type: array
          minItems: 1
          description: 'Eyebrow color palettes. Each palette controls pigment and optional shimmer effects (for shimmer textures only).

            '
          items:
            type: object
            required:
            - color
            - colorIntensity
            - texture
            properties:
              color:
                type: string
                description: 'Eyebrow pigment color in #RRGGBB format.

                  '
              colorIntensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Pigmentation strength used when applying eyebrow color.

                  '
              texture:
                type: string
                enum:
                - matte
                - shimmer
                description: 'Brow pigment texture style. Shimmer adds reflective highlights to brow hairs.

                  '
              shimmerColor:
                type: string
                description: 'Shimmer color applied when texture = shimmer.

                  '
              shimmerIntensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Strength of shimmer glow. Required only if texture = shimmer.

                  '
              shimmerSize:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Size of shimmer particles. Required for shimmer textures.

                  '
              shimmerDensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Density of shimmer particles in the brow. Required for shimmer textures.

                  '
      example:
        category: eyebrows
        pattern:
          type: shape
          name: SoftArch1
          curvature: 10
          thickness: 5
          definition: 50
        palettes:
        - color: '#3b2f2f'
          colorIntensity: 70
          texture: matte
    ConcealerEffect:
