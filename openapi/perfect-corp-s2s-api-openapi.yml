    RunHairColorTaskParams:
      type: object
      properties:
        preset:
          type: string
          description: '(optional; required if neither "pattern" nor "palettes" is provided)

            Default hair color preset. Available for full mode: [''Jet Black'',

            ''Chocolate Brown'', ''Honey Blonde'', ''Platinum Blonde'', ''Ash Gray'',

            ''Rose Gold'', ''Burgundy'', ''Copper Red'', ''Lavender'', ''Teal Blue'']

            Available for ombre mode: [''Dark Brown/Caramel Blonde'', ''Jet

            Black/Silver Gray'', ''Ash Brown/Lavender'', ''Rose Gold/Peach Blonde'',

            ''Burgundy/Magenta Pink'', ''Deep Blue/Teal Green'', ''Plum Purple/Pastel

            Lilac'', ''Copper Red/Golden Blonde'', ''Dark Gray/Ice Blonde'',

            ''Midnight Blue/Denim Blue'']

            '
          enum:
          - Jet Black
          - Chocolate Brown
          - Honey Blonde
          - Platinum Blonde
          - Ash Gray
          - Rose Gold
          - Burgundy
          - Copper Red
          - Lavender
          - Teal Blue
          - Dark Brown/Caramel Blonde
          - Jet Black/Silver Gray
          - Ash Brown/Lavender
          - Rose Gold/Peach Blonde
          - Burgundy/Magenta Pink
          - Deep Blue/Teal Green
          - Plum Purple/Pastel Lilac
          - Copper Red/Golden Blonde
          - Dark Gray/Ice Blonde
          - Midnight Blue/Denim Blue
        pattern:
          type: object
          description: (optional; required if "preset" is not provided)
          required:
          - name
          properties:
            name:
              type: string
              enum:
              - ombre
              - full
              description: Pattern type (required)
            blend_strength:
              type: integer
              minimum: 0
              maximum: 100
              description: (optional; required for ombre) Blend strength (0–100)
            line_offset:
              type: number
              minimum: -0.99
              maximum: 0.99
              description: '(optional; required for ombre) Vertical offset (–0.99 to 0.99).

                0.99: top color covers 99% of bottom half;   –0.99: bottom color

                covers 99% of top half

                '
            coloring_section:
              type: string
              enum:
              - top
              description: (optional; required for ombre) Section to color
        palettes:
          type: array
          description: '(optional; required if "preset" is not provided)   Array length 1

            for full mode, 2 for ombre mode

            '
          minItems: 1
          maxItems: 2
          items:
            type: object
            required:
            - color
            properties:
              color:
                type: string
                pattern: ^#([A-Fa-f0-9]{6})$
                description: Hex color code
              color_intensity:
                type: integer
                minimum: 0
                maximum: 100
                description: Color intensity (0–100)
              shine_intensity:
                type: integer
                minimum: 0
                maximum: 100
                description: Shine intensity (0–100)
