      description: 'Errors:

        - `exceed_max_filesize` - Input file size exceeds the maximum limit

        - `invalid_parameter` - Invalid parameter value

        - `error_download_image` - Download source image error

        - `error_download_mask` - Download mask image error

        - `error_decode_image` - Decode source image error

        - `error_decode_mask` - Decode mask image error

        - `error_nsfw_content_detected` - NSFW content detected in source image

        - `error_no_face` - No face detected on source image

        - `error_pose` - Failed to detect pose on source image

        - `error_face_parsing` - Failed to do face segmentation on source image

        - `error_inference` - Inference pipeline error

        - `exceed_nsfw_retry_limits` - Exceed the retry limits to avoid generated NSFW image

        - `error_upload` - Upload result image error

        - `unknown_internal_error` - Others

        '
    FoundationEffect:
      type: object
      description: 'Applies foundation to even skin tone using pigment, coverage, and glow controls. Unlike blush/contour, foundation has no pattern — it is applied globally based on skin segmentation.

        '
      required:
      - category
      - palettes
      properties:
        category:
          type: string
          enum:
          - foundation
          description: 'Identifies this effect as a foundation effect. Must always be "foundation".

            '
        palettes:
          type: array
          minItems: 1
          description: 'Foundation palette entries controlling tone, coverage, glow, and color intensity.

            '
          items:
            type: object
            required:
            - color
            - colorIntensity
            - glowIntensity
            - coverageIntensity
            properties:
              color:
                type: string
                description: 'Foundation shade in #RRGGBB format. Typically close to natural skin tone.

                  '
              colorIntensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Intensity of foundation coloration.

                  '
              glowIntensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Adds luminosity to the skin finish. Higher values produce a radiant or dewy effect.

                  '
              coverageIntensity:
                type: integer
                minimum: 0
                maximum: 100
                description: 'Controls opacity of foundation coverage. Higher values hide more imperfections.

                  '
      example:
        category: foundation
        palettes:
        - color: '#eac595'
          colorIntensity: 50
          glowIntensity: 10
          coverageIntensity: 50
    ContourEffect:
      type: object
      description: 'Defines contouring for facial sculpting using patterns tailored to specific face shapes. Contour patterns determine highlight/shadow placement, while palettes control the contour shade.

        '
      required:
      - category
      - pattern
      - palettes
      properties:
        category:
          type: string
          enum:
          - contour
          description: 'Identifies this effect as a contour effect. Must always be "contour".

            '
        pattern:
          type: object
          required:
          - name
          description: 'Defines where contour shadowing is applied on the face. Must use a pattern name defined in contour.json (e.g., HeartFace2, OvalFace6).

            '
          properties:
            name:
              type: string
              description: 'Name of the contour pattern. Must be equal to a `label` from contour.json.

                '
              example: OvalFace6
        palettes:
          type: array
          minItems: 1
          description: 'Defines the pigment used for contouring. Usually a cool-tone or neutral shade darker than foundation.

            '
          items:
            type: object
            required:
            - color
            - colorIntensity
            properties:
              color:
                type: string
                description: 'Contour pigment color in #RRGGBB hex format.

                  '
              colorIntensity:
                type: integer
