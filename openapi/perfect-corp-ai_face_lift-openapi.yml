openapi: 3.0.0
info:
  title: AI Face Lift
  description: "# Overview\nAI Face Lift is a generative AI facial enhancement feature that allows precise\
    \ and natural facial refinement through adjustable parameters. Instead of applying filters, the system\
    \ intelligently analyzes facial structure, skin quality, and proportions, then reconstructs the image\
    \ to produce realistic improvements that preserve the individual's identity.\n\nUsers can control\
    \ specific facial areas such as eye bags, cheeks, forehead, overall face shape, and mouth using numeric\
    \ values from 0 to 100. Each parameter increases the level of enhancement gradually, allowing subtle\
    \ touch ups or more polished results depending on user preference. All adjustments are designed to\
    \ remain natural and balanced, avoiding exaggerated or artificial outcomes.\n\nAI Face Lift provides\
    \ flexible, feature level control for creating a refreshed, confident, and professional appearance\
    \ suitable for social media, profile photos, creative content, or business use.\n\n\n![](https://bcw-media.s3.ap-northeast-1.amazonaws.com/01_1_6c0d97eb51.jpg)\n\
    \n![](https://bcw-media.s3.ap-northeast-1.amazonaws.com/01_2_8c428a25dc.jpg)\n\n\n## Integration Guide\n\
    This guide walks you through:\n\nWorkflow for AI Face Lift API:\n\n**Endpoint:** `/s2s/v2.0/task/face-lift`\n\
    \n**Authentication Required:** `Authorization: Bearer YOUR_API_KEY`\n\n**Workflow Steps:**\n\n1. **Image\
    \ Upload Preparation:**\n  - Prepare a selfie image for upload.\n  - Call the File API `/s2s/v2.0/file`\
    \ to obtain the upload URL and associated `file_id`.\n  - Upload the selfie image using the provided\
    \ upload URL.\n\n2. **Optional Preprocessing For Multiple Faces:**\n    - Preprocess the selfie image\
    \ if there are more than one face in the image.\n\n3. **Face Lift Effect Setup:**\n   - Begin by selecting\
    \ suitable face lift parameters.\n\n4. **Initiate AI Task and Obtain Task ID:**\n   - Send the `file_id`\
    \ along with the chosen effect configuration via an HTTP POST request to `/s2s/v2.0/task/face-lift`.\n\
    \   - Await a unique task ID in the response, which identifies this interaction.\n\n5. **Poll Task\
    \ Status (Continuous Check):**\n   - Use the obtained `task_id` to periodically poll the task status\
    \ using an HTTP GET request (e.g., `GET /s2s/v2.0/task/face-lift${task_id}`).\n   - Continuously monitor\
    \ for:\n     - `Task_status = \"success\"` (process completed).\n     - `Task_status = \"error\"`\
    \ (resolve or retry if applicable).\n   - Update the workflow accordingly once the status transitions\
    \ to success.\n\nThis structured workflow ensures efficient integration with user inputs, automated\
    \ monitoring of tasks, and seamless retrieval of results.\n\n\n---\n\n1.  Authentication\n    - Include\
    \ your API key in the request header using **Bearer Token**:\n        ```\n        Authorization:\
    \ Bearer YOUR_API_KEY\n        ```\n    You can find your API Key at https://yce.makeupar.com/api-console/en/api-keys/.\n\
    \n\n2.  Upload an Image\n\n    You may upload a file directly to the server or provide a valid image\
    \ URL in the AI task payload.\n\n    * Upload Endpoint\n\n        ```\n        POST /s2s/v2.0/file\n\
    \        ```\n\n    Alternatively, skip this step if you already have a public image URL.\n\n---\n\
    \n3. Select the target face to be enhanced by preprocessing\n\n   * Calling the preprocessing API\n\
    \    Output detected bounding boxes in pixel coordinate. Use the index of result to create a Face\
    \ Lift AI task later.\n        ```\n        POST /s2s/v2.0/task/face-lift/pre-process\n        ```\n\
    \n        ```\n        {\n            \"timed\": number,\n            \"result\": [\n            \
    \    {\n                    \"left\": number,\n                    \"top\": number,\n            \
    \        \"width\": number,\n                    \"height\": number\n                }\n         \
    \   ]\n        }\n        ```\n\n4. Create a Face Lift AI Task and Poll for Results\n\n    Once you\
    \ have an image and a complete effect payload, create a task. The API processes the request asynchronously.\
    \ You must poll the task status until it reaches `success` or `error`.\n\n   * Create Task Endpoint\n\
    \n        ```\n        POST /s2s/v2.0/task/face-lift\n        ```\n\n   * Polling Endpoint\n\n   \
    \     ```\n        GET /s2s/v2.0/task/face-lift/{task_id}\n        ```\n\n---\n\n## File Specs & Errors\n\
    \n* AI Face Lift Specification\n\n**Supported Selfie View**\nImages must be no larger than 1920 x\
    \ 1920, contain a clearly visible face of sufficient size exceeding 32 x 32 pixels when the long edge\
    \ is 640, and be captured with a roll angle within plus or minus 75 degrees and a yaw angle within\
    \ plus or minus 90 degrees to ensure reliable face detection.\n\n![](https://plugins-media.makeupar.com/strapi/assets/thumbnail_face_reshape_01_85c8ffc055.jpg)\n\
    \n\n---\n\n* Supported Formats & Dimensions\n\n| AI Feature | Supported Dimensions | Supported File\
    \ Size | Supported Formats|\n|  ----  | ----  | ----  | ----  |\n| AI Face Lift | long side <= 1920\
    \ | < 10MB | jpg/jpeg/png |\n\n* Error Codes\n\n| Error Code | Description |\n|  ----  | ----  |\n\
    | RUNTIME_ERROR | An unexpected error occurred duface lift runtime |\n| PHOTO_DETECTION_FAIL | The\
    \ user photo could not be processed correctly, for example no hand detected |\n| OBJECT_DETECTION_FAIL\
    \ | The object photo could not be processed correctly, for example no product detected |\n| PHOTO_CHECK_INVALID\
    \ | The pose or size of the user photo is invalid |\n| INPUT_ERROR | The input file format is incorrect\
    \ |\n| INPUT_MAIN_IMAGE_EMPTY | A user image is required |\n\n\n* Environment & Dependency\n\n| Sample\
    \ Code Language / Tool | Recommended Runtime Versions |\n|---|---|\n| cURL | - bash >= 3.2</br>  \
    \ - curl >= 7.58 (modern TLS/HTTP support)</br>   - jq >= 1.6 (robust JSON parsing) |\n| Node.js (JavaScript)\
    \ | Node >= 18 (for global fetch) |\n| JavaScript | - Chrome / Edge >= 80</br>   - Firefox >= 74</br>\
    \   - Safari >= 13.1 |\n| PHP | PHP >= 7.4 (for modern TLS/compat), ext-curl (recommended) or allow_url_fopen=On\
    \ + ext-openssl, ext-json |\n| Python | Python >= 3.10 (for f-strings), requests >= 2.20.0 |\n| Java\
    \ | Java 11+ (for HttpClient), Jackson Databind >= 2.12.0 |\n\n---\n\n## JS Camera Kit\n{% partial\
    \ file=\"/_partials/js-camera-kit.md\" /%}\n\n---\n\n## Unit Consumption\n\n| AI Feature | Unit Consumed\
    \ |\n|---|---|\n| AI Face Lift V1.0 | 1 |\n\n---\n"
