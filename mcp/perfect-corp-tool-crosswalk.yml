rest_only:
- spec: openapi/perfect-corp-task_management-openapi.yml
  rest:
  - POST /s2s/v2.0/task/delete
  reason: Task deletion (POST /s2s/v2.0/task/delete) is published in the REST contract but exposed by no MCP tool
    on any of the three servers — an agent using MCP alone cannot delete a task or its stored files.
