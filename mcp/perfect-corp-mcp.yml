generated: '2026-09-02'
method: probed
source: >-
  https://docs.perfectcorp.com/develop/mcp (published configuration) plus a live anonymous MCP
  initialize + tools/list handshake against each of the three endpoints on 2026-09-02.
name: YouCam MCP Servers
description: >-
  Perfect Corp ships three hosted, remote MCP servers that front the YouCam AI REST API, split by
  solution category. All three answer `initialize` and `tools/list` ANONYMOUSLY over Streamable
  HTTP — the full tool set with per-tool JSON Schema was read without any credential — while tool
  INVOCATION requires the same `Authorization: Bearer <API key>` used by the REST API. A fourth MCP
  server, a documentation-search server, is served from the docs host and is listed separately.

deployment:
  mode: remote
  endpoint: https://mcp-api-01.makeupar.com/mcp/beauty
  auth: api-key
  verified: probed
  note: >-
    Three sibling remote endpoints share one deployment (beauty / fashion / creators); the `endpoint`
    field carries the beauty server because the block takes a single URL — see servers[] below for
    all three. No stdio package is published: the provider's Claude Desktop instructions wrap the
    REMOTE url with the third-party `npx -y mcp-remote` shim, which is a client-side transport
    bridge, not a Perfect Corp package, so mode is `remote` and not `both`.

transport: streamable-http
protocol_version: '2025-06-18'
authentication:
  scheme: http-bearer
  header: 'Authorization: Bearer <YOUR_API_KEY>'
  key_source: https://yce.perfectcorp.com/api-console/en/api-keys/
  anonymous_discovery: true
  note: >-
    initialize and tools/list returned HTTP 200 with no Authorization header on all three servers
    (probed 2026-09-02). /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource
    both 404 on mcp-api-01.makeupar.com, so the MCP surface is API-key only, not OAuth.

