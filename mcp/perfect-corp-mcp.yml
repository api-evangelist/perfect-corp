    url: https://docs.perfectcorp.com/mcp
    server_info:
      name: Docs MCP server
      version: '2026-09-03'
    capabilities: [tools, logging]
    tool_count: 6
    tools_manifest: mcp/perfect-corp-docs-tools-list.json
    http_status: 200
    scope: documentation
    tools: [list-apis, get-endpoints, get-endpoint-info, get-security-schemes, get-full-api-description, search]
    note: >-
      A documentation-search MCP server on the provider's own docs host. It reads the OpenAPI
      documents the docs site renders rather than calling the YouCam API, so it is a discovery
      surface rather than an execution surface. It requires no session id and no credential.

