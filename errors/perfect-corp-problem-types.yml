gaps:
  - >-
    No 429 or 500 response is declared on 101 of the 178 operations, though the platform-wide rate
    limit applies to all of them.
  - >-
    No `type` URI, `title`/`detail` split, or problem+json media type — a client cannot dereference
    an error for documentation.
  - >-
    Engine errors are carried in a 200 body, so error handling cannot be driven by HTTP status alone.

