name: Perfect Corp YouCam API — plans and pricing
description: >-
  Perfect Corp publishes a public API pricing page and a documented prepaid-unit billing model, but
  the tier table itself renders client-side and is not present in the served HTML, so no tier can be
  transcribed without fabricating it. The machine-readable half of the model — the per-feature unit
  cost catalog — exists as a real API operation but requires a key.
plan_count: 0
plan_count_note: >-
  Zero plans are recorded because zero are readable, NOT because Perfect Corp publishes none. The page
  at /ai-api/api-pricing returns HTTP 200 with the title "API Pricing Plan for Developer"; its React
  Server Component payload contains navigation and metadata only, and the plan cards are fetched by
  the browser after hydration. Recording an invented tier would be worse than recording this gap.

pricing_url: https://yce.perfectcorp.com/ai-api/api-pricing
billing_model: prepaid units (documented code name "Credit")
billing_model_detail: >-
  "Units is the currency used for YouCam API operations; different AI features deduct different
  amounts of units." Accounts hold a unit balance topped up either by subscription or by
  pay-as-you-go purchase; both are managed in the API console, which also shows the usage record.
  Insufficient balance surfaces as the request error_code CreditInsufficiency.
free_tier:
  exists: true
  detail: >-
    Registration for a YouCam API account is free ("register a YouCam API account for free"), and the
    product page markets a free trial. The size of the free unit grant is not stated on any
    server-rendered page.
  signup: https://yce.perfectcorp.com/ai-api

