name: Perfect Corp YouCam API — authentication
description: 'One credential covers the whole platform: a YouCam API key sent as an HTTP bearer token. The same
  key authenticates the REST API and all three hosted MCP servers. An OAuth 2.0 authorization server is ALSO discoverable
  at the API host well-known path, but nothing in the developer documentation references it and no published operation
  requires it.'
primary:
  scheme: http-bearer
  header: 'Authorization: Bearer <YOUR_API_KEY>'
  applies_to:
  - REST API (all 178 published operations)
  - MCP servers beauty / fashion / creators
  key_management: https://yce.perfectcorp.com/api-console/en/api-keys/
  signup: https://yce.perfectcorp.com/ai-api
  key_prefix: null
  rotation: Keys are generated and maintained in the API Console; no rotation policy or expiry period is published.
  documented_failure_modes:
  - 'Missing the "Bearer " prefix — send `Authorization: Bearer KEY`, not `Authorization: KEY`.'
  - Wrapping the key in angle brackets (`Bearer <KEY>`) — the brackets are sent literally and the request fails.
  - Inactive or expired key — error codes InactiveApiKey / ExpiredApiKey.
  error_codes:
  - InvalidApiKey
  - InactiveApiKey
  - ExpiredApiKey
legacy:
  scheme: http-bearer (exchanged access_token)
  name: BearerAuthentication
  flow: POST /s2s/v1.0/client/auth exchanges client credentials for a short-lived access_token.
  status: still declared in the contracts alongside the V2 scheme; no end-of-life date is published.
  error_code: InvalidAccessToken
  note: Only the unit_system contract still applies this scheme to an operation; every AI feature uses BearerAuthenticationV2.
