apis:
- name: YouCam AI REST API
  description: 'Asynchronous, task-based REST API for 60+ AI features — skin and face analysis, hair and beard,
    body reshaping, makeup and nail virtual try-on, apparel, footwear, jewellery and watch try-on, image generation
    and editing, and video generation, enhancement and style transfer. Every feature follows the same pattern: two-phase
    file upload, task creation, polling or a Standard Webhooks callback, then a result URL valid for two hours.
    Bearer-token authenticated; 65 per-feature OpenAPI 3.0.0 contracts covering 178 operations are published for
    download from the docs host.'
  humanURL: https://docs.perfectcorp.com/develop/introduction
