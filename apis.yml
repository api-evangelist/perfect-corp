- name: YouCam MCP Servers
  description: Three hosted, remote Model Context Protocol servers fronting the YouCam AI API, split by solution
    category — Beauty & Skin Care (47 tools), Fashion & Retail (18 tools) and Creators (34 tools). All three speak
    Streamable HTTP at protocol version 2025-06-18 and answer initialize and tools/list anonymously, so the full
    tool set with per-tool JSON Schema is publicly readable; invocation uses the same API key bearer token as the
    REST API.
  humanURL: https://docs.perfectcorp.com/develop/mcp
  baseURL: https://mcp-api-01.makeupar.com
  tags:
  - mcp
  - agents
  - beauty
  - fashion
  - virtual-try-on
  - generative-ai
