name: Perfect Corp
description: Perfect Corp. is the beauty-tech company behind the YouCam apps and the YouCam AI API — a RESTful,
  asynchronous, task-based platform exposing 60+ AI features for beauty, skincare, hair, fashion, jewellery and
  generative image and video work. It publishes 65 per-feature OpenAPI 3.0.0 contracts covering 178 operations,
  three hosted MCP servers whose 99 tool registrations are readable anonymously, an A2A agent card, Standard Webhooks
  task-completion callbacks, an llms.txt, and an RFC 8414 OAuth authorization-server document. Authentication is
  a single API key sent as an HTTP bearer token across every surface; billing is prepaid units with a published
  per-feature cost API. Perfect Corp is listed on NYSE as PERF and its technology is deployed by cosmetics, skincare,
  fashion and jewellery brands for virtual try-on and visual commerce.
