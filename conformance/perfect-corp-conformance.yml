  terms_of_service: https://www.perfectcorp.com/business/terms
  certifications: []
  trust_center: null
  note: >-
    A substantive SaaS privacy policy (effective August 2026, ~45,000 characters of rendered text)
    with named GDPR and CCPA/CPRA sections. No third-party audit certification (SOC 2, ISO 27001) is
    published, and no trust center exists.

